name: contadim

# Uso:
#   docker compose up -d db               → só o PostgreSQL (para quem desenvolve com `pnpm dev`)
#   docker compose --profile full up      → PostgreSQL + API + web, sem precisar de Node/pnpm
#
# Variáveis (com valores padrão) vêm do `.env` da raiz. Veja `.env.example`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contadim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contadim}
      POSTGRES_DB: ${POSTGRES_DB:-contadim}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contadim-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-contadim}:${POSTGRES_PASSWORD:-contadim}@db:5432/${POSTGRES_DB:-contadim}
      # Vazio = a API gera um segredo aleatório ao iniciar (ok para testar localmente).
      JWT_ACCESS_SECRET: ${FULL_JWT_ACCESS_SECRET:-}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      # Acesso por http://localhost: o cookie não pode exigir HTTPS aqui.
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: contadim-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  pgdata:
